<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image Text Shape </title>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.3/dist/heic2any.min.js"></script>

  <script src="tailwindcss.min.js"></script>
  <link rel='shortcut icon' href='favicon.png' type='image/x-icon' />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="flex flex-col min-h-screen">

<a href="/cooltools/" class="-mt-1 ml-0.5 text-sm text-gray-300 outline-none">π</a>



  <!-- Toolbar -->
  <div class="flex flex-wrap gap-0 items-center justify-center p-0 z-10">

    <button id="addTextBtn" class="w-8 h-8 mr-4 px-4 py-2 min-w-[100px]">
    <img src="text.svg" alt="TEXT">
    </button>
    <button id="addImageBtn" class="w-8 h-8 px-4 py-2 min-w-[100px]">
    <img src="image.svg" alt="IMAGE">
    </button>

    <button id="addShapeBtn" class="w-8 h-8 px-4 py-2 min-w-[100px]">
    <img src="shape.svg" alt="SHAPE">
    </button>

    <!-- hidden for now -->
    <input type="color" id="bgColorPicker" value="#ffffff" class="w-10 h-10 border rounded hidden">

    <!-- <button id="saveBtn" class="w-8 h-8 px-4 py-2 min-w-[100px]">
      <span class="btn-text">
        <img src="save.svg" alt="SAVE">
      </span>
    </button> -->

    <!-- <button id="clearBtn" class="relative w-full">
      <img src="trash.svg" alt="CLEAR ALL" class="absolute -top-8 right-0 w-8 h-8 rotate-3">
    </button> -->

    <button id="clearBtn" class="w-8 h-8 rotate-3">
      <img src="trash.svg" alt="CLEAR ALL">
    </button>

  </div>

  <!-- Fullscreen canvas -->
  <div id="canvasContainer" class="flex-1 relative overflow-hidden bg-white"></div>



<!-- Context Menu -->
<div id="contextMenu" class="hidden absolute bg-white border border-gray-300 shadow-lg rounded-md text-sm z-50 min-w-[180px] transition-all duration-150">
  <ul class="divide-y divide-gray-200">
    <li class="px-3 py-2 hover:bg-blue-100 cursor-pointer" data-action="edit">Edit</li>
    <li class="px-3 py-2 hover:bg-blue-100 cursor-pointer" data-action="duplicate">Duplicate</li>
    <li class="px-3 py-2 hover:bg-blue-100 cursor-pointer" data-action="delete">Delete</li>
    <li class="px-3 py-2 hover:bg-blue-100 cursor-pointer" data-action="bringFront">Bring to Front</li>
    <li class="px-3 py-2 hover:bg-blue-100 cursor-pointer" data-action="sendBack">Send to Back</li>
  </ul>


<div id="imageAccordion" class="hidden border-t border-gray-200">
  <button id="toggleImageOptions"
    class="w-full flex justify-between items-center px-3 py-2 text-gray-700 hover:bg-blue-50 font-medium">
    Image Options
    <svg id="imageArrowIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-200" fill="none"
      viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <div id="imageOptions" class="overflow-hidden max-h-0 transition-all duration-300 ease-in-out bg-gray-50 px-3 py-0 space-y-2">
    <label class="block text-xs font-semibold text-gray-600">Brightness</label>
    <input type="range" min="0" max="200" value="100" data-action="brightness" class="w-full">

    <label class="block text-xs font-semibold text-gray-600">Contrast</label>
    <input type="range" min="0" max="200" value="100" data-action="contrast" class="w-full">
    
    <label class="block text-xs font-semibold text-gray-600">Saturation</label>
    <input type="range" min="0" max="500" value="100" data-action="saturation" class="w-full">

    <label class="block text-xs font-semibold text-gray-600">Opacity</label>
    <input type="range" min="0" max="100" value="100" data-action="opacity" class="w-full">
  </div>
</div>


  <!-- Collapsible Text Options -->
  <div id="textAccordion" class="hidden border-t border-gray-200">
    <button id="toggleTextOptions"
      class="w-full flex justify-between items-center px-3 py-2 text-gray-700 hover:bg-blue-50 font-medium">
      Text Options
      <svg id="arrowIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-200" fill="none"
        viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <div id="textOptions" class="overflow-hidden max-h-0 transition-all duration-300 ease-in-out bg-gray-50 px-3 py-0 space-y-2">
      <!-- Font -->
      <div>
        <label class="block text-xs font-semibold text-gray-600">Font Family</label>
        <select id="fontSelectMenu"
          class="w-full border border-gray-300 rounded-md text-sm p-1 focus:ring-blue-400 focus:border-blue-400">
          <option value="Arial" style="font-family: Arial;">Arial</option>
          <option value="Helvetica" style="font-family: Helvetica;">Helvetica</option>
          <option value="Menlo" style="font-family: Menlo;">Menlo</option>
          <option value="Georgia" style="font-family: Georgia;">Georgia</option>
          <option value="Times New Roman" style="font-family: 'Times New Roman';">Times New Roman</option>
          <option value="Courier New" style="font-family: 'Courier New';">Courier New</option>
          <option value="Verdana" style="font-family: Verdana;">Verdana</option>
          <option value="Joystix" style="font-family: Joystix;">Joystix</option>
          <option value="VintageB" style="font-family: VintageB;">VintageB</option>
          <option value="Spraypaint" style="font-family: Spraypaint;">Spraypaint</option>
          <option value="Silkscreen Regular" style="font-family: Silkscreen Regular;">Silkscreen Regular</option>
          <option value="Silkscreen Bold" style="font-family: Silkscreen Bold;">Silkscreen Bold</option>
          <option value="Headline" style="font-family: Headline;">Headline</option>
          <option value="Roboto" style="font-family: Roboto;">Roboto</option>
          <option value="Typewriter" style="font-family: Typewriter;">Typewriter</option>
          <option value="Nineteen Forty Two" style="font-family: Nineteen Forty Two;">Nineteen Forty Two</option>
          <option value="Draconian" style="font-family: Draconian;">Draconian</option>
          <option value="Metalic" style="font-family: Metalic;">Metalic</option>
          <option value="Old" style="font-family: Old;">Old</option>
          <option value="Wbx" style="font-family: Wbx;">Wbx</option>
          <option value="Special Elite" style="font-family: Special Elite;">Special Elite</option>
          <option value="Marker" style="font-family: Marker;">Marker</option>
          <option value="Punk" style="font-family: Punk;">Punk</option>
          <option value="ITC" style="font-family: ITC;">ITC</option>
          <option value="Resolution" style="font-family: Resolution;">Resolution</option>

        </select>
      </div>

      <!-- Line Height -->
<div>
  <label class="block text-xs font-semibold text-gray-600">Line Height</label>
  <input type="number" id="lineHeightInput" 
         class="w-full border border-gray-300 rounded-md text-sm p-1" 
         min="-0.1" step="0.1" value="1" />
</div>
      <!-- Letter Spacing -->
<div>
  <label class="block text-xs font-semibold text-gray-600">Letter Spacing</label>
  <input type="number" id="letterSpacingInput" 
         class="w-full border border-gray-300 rounded-md text-sm p-1" 
         min="-10" step="0.1" value="0" />
</div>
      <!-- Blur -->
<div>
  <label class="block text-xs font-semibold text-gray-600">Blur</label>
  <input type="number" id="blurInput" 
         class="w-full border border-gray-300 rounded-md text-sm p-1" 
         min="0" step="0.1" value="0" />
</div>

      <!-- Text Color -->
      <div>
        <label class="block text-xs font-semibold text-gray-600">Text Color</label>
        <input type="color" id="textColorPicker"
          class="w-full h-8 border border-gray-300 rounded cursor-pointer bg-white" />
      </div>

      <!-- Background Color -->
      <div>
        <label class="block text-xs font-semibold text-gray-600">Background Color</label>
        <input type="color" id="textBgColorPicker"
          class="w-full h-8 border border-gray-300 rounded cursor-pointer bg-white" />
      </div>

      <div data-action="textBgTransparent" class="context-item pb-3">Transparent Background</div>

    </div>
    <!--  -->
  </div>

  <!-- Shape Options inside the context menu -->
<div id="shapeAccordion" class="hidden border-t border-gray-200">
  <button id="toggleShapeOptions"
      class="w-full flex justify-between items-center px-3 py-2 text-gray-700 hover:bg-blue-50 font-medium">
      Shape Options
      <svg id="shapeArrowIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-200" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
  </button>

  <div id="shapeOptions" class="overflow-hidden max-h-0 transition-all duration-300 ease-in-out bg-gray-50 px-3 py-0 space-y-2">
    <div>
      <label class="block text-xs font-semibold text-gray-600">Shape Type</label>
      <select id="shapeTypeSelect" class="w-full border border-gray-300 rounded-md text-sm p-1 focus:ring-blue-400 focus:border-blue-400">
        <option value="rectangle">Rectangle</option>
        <option value="square">Square</option>
        <option value="circle">Circle</option>
        <option value="triangle">Triangle</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600">Shape Color</label>
      <input type="color" id="shapeColorPicker" class="w-full h-8 border border-gray-300 rounded cursor-pointer bg-white" value="#2563eb" />
    </div>
  </div>
</div>


<!-- Blend Mode Options inside the context menu -->
<div id="blendModeAccordion" class="accordion-section border-t border-gray-200 px-3 py-2 bg-gray-50">
  <label for="blendModeSelect" class="sr-only">Blend Mode</label>
  <div class="relative">
    <select id="blendModeSelect" class="w-full border rounded px-3 py-2 text-sm appearance-none">
      <option value="normal">Normal</option>
      <option value="multiply">Multiply</option>
      <option value="screen">Screen</option>
      <option value="overlay">Overlay</option>
      <option value="soft-light">Soft Light</option>
      <option value="hard-light">Hard Light</option>
      <option value="difference">Difference</option>
      <option value="exclusion">Exclusion</option>
      <option value="color-burn">Color Burn</option>
      <option value="color-dodge">Color Dodge</option>
    </select>
    <!-- Arrow icon inside the select container -->
    <svg id="blendModeArrowIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </div>
</div>

</div>

  <script src="script.js"></script>
</body>
</html>
