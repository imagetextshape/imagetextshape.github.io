<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel='icon' href='https://dropzone.olk1.com/uploads/imagetextshape.png'>
  <title>Add Texture To Text</title>
  <script src="tailwindcss.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      user-select: none;
    }
    canvas {
      border: 1px solid #ccc;
    }
  </style>
</head>
<body class="bg-gray-100 overflow-hidden">
  <div class="grid grid-cols-5 h-screen">

    <!-- ========== LEFT PANEL ========== -->
    <div class="col-span-1 bg-white p-1 overflow-y-scroll scrollbar-hide">


    <!-- ========== NAV ========== -->

    <div class="bg-gray-100 text-blue-700 flex justify-between w-full px-1 mb-2">
      <a href="inkbleed.html">Inkbleed</a>
      <a href="photocopy.html">Photocopy</a>
      <a href="destructor.html">Destructor</a>
    </div>


      <!-- Text Input -->
      <div>
        <label class="block text-sm font-medium mb-1">Text</label>
        <textarea
          id="textInput"
          placeholder="Enter your text..."
          class="w-full border rounded-lg p-2 h-24 focus:ring focus:ring-blue-200 resize-none"
        ></textarea>
      </div>

      <!-- Font Select -->
      <div>
        <label class="block text-sm font-medium mb-1">Font</label>
        <select id="fontSelect" class="w-full border rounded-lg p-2">
          <option value="Headline" selected>Headline</option>
          <option value="Spraypaint">Spraypaint</option>
          <option value="Silkscreen Bold">Silkscreen Bold</option>
          <option value="Joystix">Joystix</option>
          <option value="VintageB">VintageB</option>
          <option value="Roboto">Roboto</option>
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Impact">Impact</option>
          <option value="Comic Sans MS">Comic Sans MS</option>
          <option value="Special Elite">Special Elite</option>
          <option value="Punk">Punk</option>
        </select>
      </div>

      <!-- Font Size -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Font Size: <span id="fontSizeLabel" class="font-semibold">180</span> px
        </label>
        <input id="fontSize" type="range" min="10" max="400" value="180" class="w-full accent-blue-600">
      </div>

      <!-- Line Height -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Line Height: <span id="lineHeightLabel" class="font-semibold">1</span>x
        </label>
        <input id="lineHeight" type="range" min="0.5" max="3" step="0.1" value="1" class="w-full accent-blue-600">
      </div>

      <!-- Letter Spacing -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Letter Spacing: <span id="letterSpacingLabel" class="font-semibold">0</span> px
        </label>
        <input id="letterSpacing" type="range" min="-50" max="150" step="1" value="0" class="w-full accent-blue-600">
      </div>

      <!-- Text Blur -->
<div>
  <label class="block text-sm font-medium mb-1">
    Text Blur: <span id="blurLabel" class="font-semibold">0</span> px
  </label>
  <input id="textBlur" type="range" min="0" max="20" value="0" class="w-full accent-blue-600">
</div>

<!-- Outline Checkbox -->
<div class="flex items-center space-x-2">
  <input type="checkbox" id="outlineText" class="w-4 h-4">
  <label for="outlineText" class="text-sm font-medium">Outline Text</label>
</div>


      <!-- Colors -->
      <div class="flex justify-between">
        <div>
          <label class="block text-sm font-medium mb-1">Text Color</label>
          <input id="textColor" type="color" value="#000000" class="w-full border rounded-lg p-1 cursor-pointer">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Background</label>
          <input id="bgColor" type="color" value="#ffffff" class="w-full border rounded-lg p-1 cursor-pointer">
        </div>
      </div>

      <!-- ========== TEXTURE 1 ========== -->
      <div id="dropzone1" class="border-2 border-dashed border-gray-300 p-6 text-center rounded-lg cursor-pointer hover:bg-gray-50">
        <p class="text-gray-500">Drop texture image here or click to upload</p>
        <input type="file" id="textureInput1" accept="image/*" class="hidden">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Blend Mode</label>
        <select id="blendModeSelect1" class="w-full border rounded-lg p-2">
          <option value="multiply">Multiply</option>
          <option value="screen">Screen</option>
          <option value="overlay">Overlay</option>
          <option value="soft-light">Soft Light</option>
          <option value="hard-light">Hard Light</option>
          <option value="darken">Darken</option>
          <option value="lighten">Lighten</option>
          <option value="difference">Difference</option>
          <option value="exclusion">Exclusion</option>
        </select>
      </div>

      <!-- Texture 1 Offsets -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Texture Horizontal: <span id="texture1XLabel" class="font-semibold">0</span> px
        </label>
        <input id="texture1X" type="range" min="-1000" max="2000" step="1" value="0" class="w-full accent-blue-600">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">
          Texture Vertical: <span id="texture1YLabel" class="font-semibold">0</span> px
        </label>
        <input id="texture1Y" type="range" min="-1000" max="1000" step="1" value="0" class="w-full accent-blue-600">
      </div>

      <!-- Toggles -->
      <div class="flex items-center space-x-2">
        <div>
          <input type="checkbox" checked id="blendToggle1" class="w-4 h-4">
          <label for="blendToggle1" class="text-sm font-medium">Enable Blend Mode</label>
        </div>
        <div class="flex items-center space-x-2">
          <input type="checkbox" id="doubleTexture1" class="w-4 h-4">
          <label for="doubleTexture1" class="text-sm font-medium">Double Texture Overlay</label>
        </div>
      </div>

      <!-- ========== TEXTURE 2 ========== -->
      <div id="dropzone2" class="border-2 border-dashed border-gray-300 p-6 text-center rounded-lg cursor-pointer hover:bg-gray-50">
        <p class="text-gray-500">Drop texture image here or click to upload</p>
        <input type="file" id="textureInput2" accept="image/*" class="hidden">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Blend Mode</label>
        <select id="blendModeSelect2" class="w-full border rounded-lg p-2">
          <option value="multiply">Multiply</option>
          <option value="screen">Screen</option>
          <option value="overlay">Overlay</option>
          <option value="soft-light">Soft Light</option>
          <option value="hard-light">Hard Light</option>
          <option value="darken">Darken</option>
          <option value="lighten">Lighten</option>
          <option value="difference">Difference</option>
          <option value="exclusion">Exclusion</option>
        </select>
      </div>

      <!-- Texture 2 Offsets -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Texture Horizontal: <span id="texture2XLabel" class="font-semibold">0</span> px
        </label>
        <input id="texture2X" type="range" min="-1000" max="2000" step="1" value="0" class="w-full accent-blue-600">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">
          Texture Vertical: <span id="texture2YLabel" class="font-semibold">0</span> px
        </label>
        <input id="texture2Y" type="range" min="-1000" max="1000" step="1" value="0" class="w-full accent-blue-600">
      </div>

      <!-- Toggles -->
      <div class="flex items-center space-x-2">
        <div>
          <input type="checkbox" checked id="blendToggle2" class="w-4 h-4">
          <label for="blendToggle2" class="text-sm font-medium">Enable Blend Mode</label>
        </div>
        <div class="flex items-center space-x-2">
          <input type="checkbox" id="doubleTexture2" class="w-4 h-4">
          <label for="doubleTexture2" class="text-sm font-medium">Double Texture Overlay</label>
        </div>
      </div>

      <!-- Crossfade -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Texture Blend: <span id="textureBlendLabel" class="font-semibold">50%</span>
        </label>
        <input id="textureBlend" type="range" min="0" max="100" value="50" class="w-full accent-blue-600">
      </div>

      <!-- Buttons -->
      <div class="flex justify-between pt-4 border-t">
        <button id="saveBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Save</button>
        <button id="clearBtn" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400">Clear</button>
      </div>
    </div>

    <!-- ========== CANVAS AREA ========== -->
    <!-- RIGHT PANEL (fixed canvas) -->
    <div class="col-span-4 h-screen flex items-center justify-center bg-white p-0">
      <canvas id="textCanvas" class="w-full h-full"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
