<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Effects Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  body{
    user-select: none;
  }
  </style>
</head>

<body class="bg-zinc-900 text-zinc-100 h-screen overflow-hidden">

<div class="flex h-full">

  <!-- SIDEBAR -->
  <aside class="w-80 bg-zinc-950 border-r border-zinc-800 p-4 space-y-8 overflow-y-auto">

    <!-- DROPZONE -->
    <div id="dropzone"
      class="border-2 border-dashed border-zinc-700 rounded-lg p-6 text-center text-zinc-400 cursor-pointer">
      Click or drop image
      <input id="fileInput" type="file" accept="image/*" class="hidden">
    </div>





    <!-- HALFTONE -->
    <section class="border-t border-zinc-800 pt-6 space-y-4">
      <label class="flex items-center gap-2">
        <input id="htEnabled" type="checkbox">
        <span class="font-medium text-sm">Halftone</span>
      </label>

      <div>
        <label class="text-xs">Dot Size</label>
        <input id="htDotSize" type="range" min="1" max="12" value="4" class="w-full">
      </div>

      <div>
        <label class="text-xs">Spacing</label>
        <input id="htSpacing" type="range" min="4" max="30" value="0" class="w-full">
      </div>

      <div>
        <label class="text-xs">Intensity</label>
        <input id="htIntensity" type="range" min="0" max="1" step="0.05" value="1" class="w-full">
      </div>
      

      <div>
        <label class="text-xs">Angle</label>
        <input id="htAngle" type="range" min="0" max="90" value="0" class="w-full">
      </div>

      <!-- DOT SHAPE -->
      <div>
        <label class="text-xs block mb-1">Dot Shape</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center gap-1">
            <input type="radio" name="htShape" value="round" checked>
            Round
          </label>
          <label class="flex items-center gap-1">
            <input type="radio" name="htShape" value="square">
            Square
          </label>
          <label class="flex items-center gap-1">
            <input type="radio" name="htShape" value="triangle">
            Triangle
          </label>
          <label class="flex items-center gap-1">
            <input type="radio" name="htShape" value="line">
            Line
          </label>
        </div>
      </div>

      <div>
        <label class="text-xs">Blend Mode</label>
        <select id="htBlend" class="w-full bg-zinc-800 border border-zinc-700 rounded">
          <option>normal</option>
          <option>multiply</option>
          <option>screen</option>
          <option selected>overlay</option>
          <option>darken</option>
          <option>lighten</option>
        </select>
      </div>

      <div>
        <label class="text-xs">Color</label>
        <select id="htColorMode" class="w-full bg-zinc-800 border border-zinc-700 rounded">
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="custom">Custom</option>
        </select>
        <input id="htColor" type="color" class="w-full h-8 hidden">
      </div>
    </section>




    <!-- RASTER -->
    <section class="border-t border-zinc-800 pt-6 space-y-4">
      <label class="flex items-center gap-2">
        <input id="rsEnabled" type="checkbox">
        <span class="font-medium text-sm">Newsprint Raster</span>
      </label>

      <div>
        <label class="text-xs">Scale</label>
        <input id="rsScale" type="range" min="3" max="20" value="8" class="w-full">
      </div>

      <div>
        <label class="text-xs">Strength</label>
        <input id="rsStrength" type="range" min="0" max="1" step="0.05" value="0.5" class="w-full">
      </div>

      <div>
        <label class="text-xs">Blend Mode</label>
        <select id="rsBlend" class="w-full bg-zinc-800 border border-zinc-700 rounded">
          <option>normal</option>
          <option>multiply</option>
          <option>overlay</option>
          <option>screen</option>
        </select>
      </div>

      <div>
        <label class="text-xs">Color</label>
        <select id="rsColorMode" class="w-full bg-zinc-800 border border-zinc-700 rounded">
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="custom">Custom</option>
        </select>
        <input id="rsColor" type="color" class="w-full h-8 hidden">
      </div>
    </section>

    <button id="downloadBtn" class="w-full bg-indigo-600 py-2 rounded text-sm">
      Download
    </button>

  </aside>

  <!-- PREVIEW -->
  <main class="flex-1 bg-zinc-800 flex items-center justify-center overflow-auto">
    <canvas id="canvas"></canvas>
  </main>








<aside class="w-80 bg-zinc-950 border-r border-zinc-800 p-4 space-y-8 overflow-y-auto">

<!-- EARLY DIGITAL CAMERA -->
<section class="space-y-4">
  <label class="flex items-center gap-2">
    <input id="dcEnabled" type="checkbox">
    <span class="font-medium text-sm">Early Digital Camera (1990s)</span>
  </label>
  <div>
  <label class="text-xs">Sensor Blur</label>
  <input id="dcBlur" type="range" min="0" max="3" step="0.25" value="0" class="w-full">
</div>

<div>
  <label class="text-xs">White Balance (Warm / Cool)</label>
  <input id="dcTemp" type="range" min="-0.3" max="0.3" step="0.01" value="0" class="w-full">
</div>

<div>
  <label class="text-xs">White Balance (Green / Magenta)</label>
  <input id="dcTint" type="range" min="-0.3" max="0.3" step="0.01" value="0" class="w-full">
</div>

<div>
  <label class="text-xs">Hue Shift</label>
  <input id="dcHue" type="range" min="-20" max="20" value="0" class="w-full">
</div>

<div>
  <label class="text-xs">Saturation</label>
  <input id="dcSat" type="range" min="0" max="1.5" step="0.05" value="0" class="w-full">
</div>

  <div>
    <label class="text-xs">Resolution Scale</label>
    <input id="dcScale" type="range" min="0.2" max="1" step="0.05" value="1" class="w-full">
  </div>

  <div>
    <label class="text-xs">Color Bit Depth</label>
    <input id="dcBits" type="range" min="3" max="6" value="6" class="w-full">
  </div>

  <div>
    <label class="text-xs">Noise</label>
    <input id="dcNoise" type="range" min="0" max="30" value="0" class="w-full">
  </div>

  <div>
  <label class="text-xs">Highlight Clipping</label>
  <input
    id="dcClip"
    type="range"
    min="0"
    max="1"
    step="0.05"
    value="0"
    class="w-full">
</div>


  <div>
    <label class="text-xs">Gamma Error</label>
    <input id="dcGamma" type="range" min="1.2" max="3" step="0.05" value="1.5" class="w-full">
  </div>

  <div>
  <label class="text-xs">Brightness</label>
  <input
    id="dcBrightness"
    type="range"
    min="-0.4"
    max="0.4"
    step="0.02"
    value="0"
    class="w-full">
</div>


      <div>
        <label class="text-xs">Contrast</label>
        <input id="dcContrast" type="range" min="-100" max="100" value="0" class="w-full">
      </div>

</section>

    <!-- CROSS HATCH -->
    <section class="border-t border-zinc-800 pt-6 space-y-4">
      <label class="flex items-center gap-2">
        <input id="chEnabled" type="checkbox">
        <span class="font-medium text-sm">Cross-Hatching</span>
      </label>

      <div>
        <label class="text-xs">Density</label>
        <input id="chDensity" type="range" min="4" max="24" value="10" class="w-full">
      </div>

      <div>
        <label class="text-xs">Strength</label>
        <input id="chStrength" type="range" min="0" max="1" step="0.05" value="0.6" class="w-full">
      </div>

      <div>
        <label class="text-xs">Blend Mode</label>
        <select id="chBlend" class="w-full bg-zinc-800 border border-zinc-700 rounded">
          <option>normal</option>
          <option>multiply</option>
          <option>overlay</option>
          <option>screen</option>
        </select>
      </div>

      <div>
        <label class="text-xs">Color</label>
        <select id="chColorMode" class="w-full bg-zinc-800 border border-zinc-700 rounded">
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="custom">Custom</option>
        </select>
        <input id="chColor" type="color" class="w-full h-8 hidden">
      </div>
    </section>
</aside>


</div>

<script src="script.js"></script>

</body>
</html>
