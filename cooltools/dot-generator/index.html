<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dot Generator</title>

  <script src='tailwindcss.min.js'></script>

  <style>
    body {
      font-family: sans-serif;
    }

    canvas {
      width: 100%;
      max-width: 1920px;
      height: 1080px;
      aspect-ratio: 16 / 9;
      image-rendering: auto;
    }

    input[type="range"] {
      cursor: pointer;
    }

    button {
      transition: opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body class="bg-white flex h-screen overflow-hidden">

  <!-- Canvas -->
  <div class="flex-1 mt-12 flex justify-center p-0">
    <canvas
      id="canvas"
      width="1920"
      height="1080"
      class="bg-white"
    ></canvas>
  </div>

  <!-- Controls -->
  <aside class="w-96 bg-gray-100 p-5 overflow-y-auto flex flex-col gap-5">

    <!-- Dot Size -->
    <label class="flex flex-col gap-1">
      <div class="flex justify-between text-sm">
        <span>Dot Size</span>
        <span id="dotSizeValue">8</span>
      </div>

      <input
        id="dotSize"
        type="range"
        min="1"
        max="50"
        value="8"
        class="w-full"
      >
    </label>

    <!-- Columns -->
    <label class="flex flex-col gap-1">
      <div class="flex justify-between text-sm">
        <span>Columns</span>
        <span id="colsValue">50</span>
      </div>

      <input
        id="cols"
        type="range"
        min="5"
        max="200"
        value="50"
        class="w-full"
      >
    </label>

    <!-- Rows -->
    <label class="flex flex-col gap-1">
      <div class="flex justify-between text-sm">
        <span>Rows</span>
        <span id="rowsValue">30</span>
      </div>

      <input
        id="rows"
        type="range"
        min="5"
        max="200"
        value="30"
        class="w-full"
      >
    </label>

    <!-- Falloff -->
    <label class="flex flex-col gap-1">
      <div class="flex justify-between text-sm">
        <span>Gradient Falloff</span>
        <span id="falloffValue">0.4</span>
      </div>

      <input
        id="falloff"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.4"
        class="w-full"
      >
    </label>

    <!-- Central Mode -->
    <label class="flex items-center gap-3">
      <input
        id="centralMode"
        type="checkbox"
      >
      <span>Central Origin Mode</span>
    </label>

    <!-- Central Size -->
    <label class="flex flex-col gap-1">
      <div class="flex justify-between text-sm">
        <span>Central Influence Size</span>
        <span id="centerSizeValue">300</span>
      </div>

      <input
        id="centerSize"
        type="range"
        min="0"
        max="1000"
        value="300"
        class="w-full"
      >
    </label>

<div class="flex justify-between">
<!-- Blend Mode -->
<label class="flex flex-col gap-2">
  <span>Blend Mode</span>

  <select id="blendMode" class="bg-gray-50 p-2 rounded">
    <option value="source-over">Normal</option>
    <option value="multiply">Multiply</option>
    <option value="screen">Screen</option>
    <option value="overlay">Overlay</option>
    <option value="darken">Darken</option>
    <option value="lighten">Lighten</option>
    <option value="color-dodge">Color Dodge</option>
    <option value="color-burn">Color Burn</option>
    <option value="hard-light">Hard Light</option>
    <option value="soft-light">Soft Light</option>
    <option value="difference">Difference</option>
    <option value="exclusion">Exclusion</option>
  </select>
</label>

<label class="flex flex-col gap-2">
  <span>Path Style</span>

  <select
    id="pathStyle"
    class="bg-gray-50 p-2 rounded"
  >
    <option value="solid">Solid</option>
    <option value="dashed">Dashed</option>
    <option value="dotted">Dotted</option>
  </select>
</label>

<label class="flex flex-col-reverse  items-center gap-0">
  <input
    id="invertLineColor"
    type="checkbox"
  >

  <span class="text-center text-sm mb-3.5 leading-tight">White</br/> Line</span>
</label>

<label class="flex flex-col-reverse items-center gap-0">
  <input
    id="invertDotColor"
    type="checkbox"
  >

  <span class="text-center text-sm mb-3.5 leading-tight">White</br/> Dot</span>
</label>
</div>

    <!-- Path Controls -->
    <div class="border border-gray-700 rounded p-4 flex flex-col gap-3">

      <h2 class="font-semibold">
        Random Path Lines
      </h2>

      <label class="flex flex-col gap-1">
        <div class="flex justify-between text-sm">
          <span>Line Count</span>
          <span id="pathCountValue">5</span>
        </div>

        <input
          id="pathCount"
          type="range"
          min="1"
          max="40"
          value="5"
          class="w-full"
        >
      </label>

      <label class="flex flex-col gap-1">
        <div class="flex justify-between text-sm">
          <span>Line Width</span>
          <span id="lineWidthValue">2</span>
        </div>

        <input
          id="lineWidth"
          type="range"
          min="1"
          max="20"
          value="2"
          class="w-full"
        >
      </label>

      <button
        id="generatePaths"
        class="bg-green-500 p-2 rounded font-medium"
      >
        Generate Random Paths
      </button>

      <button
        id="clearPaths"
        class="bg-red-500 p-2 rounded font-medium"
      >
        Clear Paths
      </button>

    </div>

    <!-- Random Dot Sizes -->
    <div class="border border-gray-700 rounded p-4 flex flex-col gap-3">

      <h2 class="font-semibold">
        Dot Randomisation
      </h2>

      <label class="flex items-center gap-3">
        <input
          id="randomDotMode"
          type="checkbox"
        >

        <span>Enable Random Dot Sizes</span>
      </label>

      <label class="flex flex-col gap-1">
        <div class="flex justify-between text-sm">
          <span>Random Intensity</span>
          <span id="randomAmountValue">1</span>
        </div>

        <input
          id="randomAmount"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          class="w-full"
        >
      </label>

      <button
        id="randomiseDots"
        class="bg-purple-500 p-2 rounded font-medium"
      >
        Randomise Dot Sizes
      </button>

    </div>

    <!-- Image Upload -->
    <div
      id="dropzone"
      class="border-2 border-dashed border-gray-500 rounded p-6 text-center cursor-pointer"
    >
      <div class="flex flex-col gap-2">
        <span class="font-medium">
          Drop Image Here
        </span>

        <span class="text-sm text-gray-400">
          or click to upload
        </span>
      </div>

      <input
        id="fileInput"
        type="file"
        accept="image/*"
        class="hidden"
      >
    </div>

<button id="exportBtn" class="bg-cyan-400 text-white px-4 py-2 rounded w-full">
  Save PNG
</button>
  </aside>

<script src="script.js"></script>
</body>
</html>
