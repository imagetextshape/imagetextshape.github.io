<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel='icon' href='https://dropzone.olk1.com/uploads/imagetextshape.png'>
<title>Destructor</title>
<style>
  body {
    margin: 0;
    display: flex;
    height: 100vh;
    background: #111;
    color: #fff;
    font-family: sans-serif;
  }
  a{
    color: white;
  }
  #controls {
    width: 270px;
    background: #1a1a1a;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-right: 1px solid #333;
  }
  label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
  }
  input[type="range"] {
    width: 100%;
  }
  button {
    padding: 8px;
    background: #333;
    border: none;
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #555;
  }
  #dropzone {
    border: 2px dashed #555;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    color: #aaa;
    cursor: pointer;
    transition: background 0.3s;
  }
  #dropzone:hover { background: #222; }

  #preview {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }
canvas { max-width: 95%; max-height: 95%; border: 1px solid #222; }
</style>
</head>
<body>
  <div id="controls">




    <div id="dropzone">Drop or click to upload image</div>
    <input type="file" id="fileInput" accept="image/*" hidden>

    <label>Contrast <span id="contrastVal">1</span></label>
    <input type="range" id="contrastSlider" min="0" max="3" step="0.1" value="1">

    <label>Noise <span id="noiseVal">0.05</span></label>
    <input type="range" id="noiseSlider" min="0" max="1" step="0.01" value="0.05">

    <label>Banding <span id="bandVal">0.1</span></label>
    <input type="range" id="bandSlider" min="0" max="1" step="0.01" value="0.1">

    <label>Shift X <span id="shiftXVal">0</span></label>
    <input type="range" id="shiftXSlider" min="-20" max="20" step="1" value="0">

    <label>Shift Y <span id="shiftYVal">0</span></label>
    <input type="range" id="shiftYSlider" min="-20" max="20" step="1" value="0">

    <label>Smear X <span id="smearXVal">0</span></label>
    <input type="range" id="smearXSlider" min="0" max="30" step="1" value="0">

    <label>Smear Y <span id="smearYVal">0</span></label>
    <input type="range" id="smearYSlider" min="0" max="30" step="1" value="0">

    <label>Passes <span id="passVal">1</span></label>
    <input type="range" id="passSlider" min="1" max="5" step="1" value="1">

    <button id="compareBtn">Compare Original</button>
    <button id="resetBtn">Reset</button>
    <button id="saveBtn">Save</button>
  </div>

  <div id="preview">
    <canvas id="photoCanvas"></canvas>
  </div>

<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("photoCanvas");
const ctx = canvas.getContext("2d");

const sliders = {
  contrast: document.getElementById("contrastSlider"),
  noise: document.getElementById("noiseSlider"),
  band: document.getElementById("bandSlider"),
  shiftX: document.getElementById("shiftXSlider"),
  shiftY: document.getElementById("shiftYSlider"),
  smearX: document.getElementById("smearXSlider"),
  smearY: document.getElementById("smearYSlider"),
  pass: document.getElementById("passSlider"),
};
const vals = {
  contrast: document.getElementById("contrastVal"),
  noise: document.getElementById("noiseVal"),
  band: document.getElementById("bandVal"),
  shiftX: document.getElementById("shiftXVal"),
  shiftY: document.getElementById("shiftYVal"),
  smearX: document.getElementById("smearXVal"),
  smearY: document.getElementById("smearYVal"),
  pass: document.getElementById("passVal"),
};
const resetBtn = document.getElementById("resetBtn");
const saveBtn = document.getElementById("saveBtn");
const compareBtn = document.getElementById("compareBtn");

let image = null;
let originalImageData = null;
let showingOriginal = false;

// Dropzone
dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.style.background = "#333"; });
dropzone.addEventListener("dragleave", () => dropzone.style.background = ""); 
dropzone.addEventListener("drop", e => {
  e.preventDefault(); dropzone.style.background = "";
  const file = e.dataTransfer.files[0];
  if (file) loadImage(file);
});
fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (file) loadImage(file);
});

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      image = img;
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      originalImageData = ctx.getImageData(0, 0, img.width, img.height);
      drawPhotocopyEffect();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function drawPhotocopyEffect() {
  if (!originalImageData) return;
  if (showingOriginal) return ctx.putImageData(originalImageData, 0, 0);

  const temp = document.createElement("canvas");
  temp.width = canvas.width;
  temp.height = canvas.height;
  const tctx = temp.getContext("2d");
  tctx.putImageData(originalImageData, 0, 0);

  const w = temp.width, h = temp.height;
  const passes = parseInt(sliders.pass.value);
  const contrast = parseFloat(sliders.contrast.value);
  const noiseAmt = parseFloat(sliders.noise.value);
  const bandStrength = parseFloat(sliders.band.value);
  const shiftX = parseFloat(sliders.shiftX.value);
  const shiftY = parseFloat(sliders.shiftY.value);
  const smearX = parseFloat(sliders.smearX.value);
  const smearY = parseFloat(sliders.smearY.value);

  for (let p = 0; p < passes; p++) {
    const imgData = tctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const shifted = document.createElement("canvas");
    shifted.width = w; shifted.height = h;
    const sctx = shifted.getContext("2d");
    sctx.drawImage(temp, shiftX, shiftY, w, h, 0, 0, w, h);
    const sPix = sctx.getImageData(0, 0, w, h).data;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w + x)*4;
        let r = sPix[i], g = sPix[i+1], b = sPix[i+2];
        let gray = 0.299*r + 0.587*g + 0.114*b;
        gray = (((gray/255)-0.5)*contrast + 0.5)*255;
        gray += (Math.random()-0.5)*255*noiseAmt;
        gray += Math.sin(y/5)*255*bandStrength;
        gray = Math.min(255, Math.max(0, gray));
        data[i] = data[i+1] = data[i+2] = gray;
      }
    }
    tctx.putImageData(imgData, 0, 0);

    // --- Destructive Smear ---
    if (smearX > 0 || smearY > 0) {
      const smearData = tctx.getImageData(0, 0, w, h);
      const src = smearData.data;

      for (let y = 0; y < h; y++) {
        const offsetX = Math.floor((Math.random()-0.5)*smearX*2);
        for (let x = 0; x < w; x++) {
          const targetX = x + offsetX;
          if (targetX >= 0 && targetX < w) {
            const i = (y*w+x)*4;
            const j = (y*w+targetX)*4;
            src[j] = (src[j] + src[i]) / 1.8;
            src[j+1] = (src[j+1] + src[i+1]) / 1.8;
            src[j+2] = (src[j+2] + src[i+2]) / 1.8;
          }
        }
      }

      for (let x = 0; x < w; x++) {
        const offsetY = Math.floor((Math.random()-0.5)*smearY*2);
        for (let y = 0; y < h; y++) {
          const targetY = y + offsetY;
          if (targetY >= 0 && targetY < h) {
            const i = (y*w+x)*4;
            const j = (targetY*w+x)*4;
            src[j] = (src[j] + src[i]) / 1.8;
            src[j+1] = (src[j+1] + src[i+1]) / 1.8;
            src[j+2] = (src[j+2] + src[i+2]) / 1.8;
          }
        }
      }

      tctx.putImageData(smearData, 0, 0);
    }
  }

  ctx.clearRect(0,0,w,h);
  ctx.drawImage(temp, 0, 0);
}

// update + reset + save + compare
function updateLabels(){
  for (const k in vals) vals[k].textContent = sliders[k].value;
}
for (const k in sliders){
  sliders[k].addEventListener("input", ()=>{ updateLabels(); drawPhotocopyEffect(); });
}
resetBtn.addEventListener("click", ()=>{ for(const k in sliders) sliders[k].value=sliders[k].defaultValue; updateLabels(); drawPhotocopyEffect(); });
saveBtn.addEventListener("click", ()=>{
  const a=document.createElement("a");
  a.download="photocopy.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
});
compareBtn.addEventListener("click", ()=>{
  showingOriginal=!showingOriginal;
  compareBtn.textContent=showingOriginal?"Show Effect":"Compare Original";
  drawPhotocopyEffect();
});

updateLabels();
</script>
</body>
</html>
