<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel='icon' href='data:;base64,='>
  <script src='../tailwindcss.min.js'></script>
  <title>Document</title>
</head>
<body>
  <div class="min-h-screen bg-neutral-900 text-white p-6 space-y-4">

  <!-- Controls -->
  <div class="flex flex-wrap gap-4 items-center">
    <input
      id="textInput"
      type="text"
      value="PRINT"
      class="bg-black border border-neutral-700 px-3 py-2 w-64"
    />

    <select
      id="blendMode"
      class="bg-black border border-neutral-700 px-3 py-2"
    >
      <option value="normal">normal</option>
      <option value="multiply">multiply</option>
      <option value="screen">screen</option>
      <option value="overlay">overlay</option>
      <option value="difference" selected>difference</option>
      <option value="lighter">lighter</option>
    </select>

    <input
      id="opacity"
      type="range"
      min="0.01"
      max="0.3"
      step="0.01"
      value="0.08"
    />

    <label>
  X Drift
  <input id="driftX" type="range" min="-20" max="20" step="0.1" value="0">
</label>

<label>
  Y Drift
  <input id="driftY" type="range" min="-20" max="20" step="0.1" value="0">
</label>

<label>
  Rotation
  <input id="rotation" type="range" min="-0.2" max="0.2" step="0.001" value="0">
</label>



  </div>

  <!-- Dropzone -->
  <label
    id="dropzone"
    class="flex items-center justify-center border-2 border-dashed border-neutral-600 h-32 cursor-pointer hover:border-white transition"
  >
    <span class="opacity-70">Drop image or click to upload</span>
    <input id="imageInput" type="file" accept="image/*" class="hidden" />
  </label>

  <!-- Canvas -->
  <div class="flex justify-center">
    <canvas
      id="canvas"
      class="border border-neutral-700"
      width="1280"
      height="768"
    ></canvas>
  </div>

</div>

<script>
/* =====================
   CANVAS
===================== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

/* =====================
   STATE
===================== */
const state = {
  text: "PRINT",
  fontSize: 220,
  opacity: 0.25,
  blendMode: "screen",
  overlayImage: null,

  driftX: 0,
  driftY: 0,
  rotation: 0,

  running: true
};


/* =====================
   IMAGE UPLOAD
===================== */
const imageInput = document.getElementById("imageInput");
const dropzone   = document.getElementById("dropzone");

function loadImage(file) {
  const img = new Image();

  img.onload = () => {
    console.log("Overlay loaded:", img.width, img.height);
    state.overlayImage = img;
  };

  img.onerror = () => {
    console.error("Overlay failed to load");
  };

  img.src = file
    ? URL.createObjectURL(file)
    : "../xerox_texture_1_low-res.png";
}


dropzone.addEventListener("dragover", e => {
  e.preventDefault();
  dropzone.classList.add("border-white");
});

dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("border-white");
});

dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.classList.remove("border-white");
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

imageInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (file) loadImage(file);
});

/* =====================
   CONTROLS
===================== */
document.getElementById("textInput").addEventListener("input", e => {
  state.text = e.target.value;
});

document.getElementById("blendMode").addEventListener("change", e => {
  state.blendMode = e.target.value;
});

document.getElementById("opacity").addEventListener("input", e => {
  state.opacity = parseFloat(e.target.value);
});


document.getElementById("driftX").addEventListener("input", e => {
  state.driftX = parseFloat(e.target.value);
  stamp();
});

document.getElementById("driftY").addEventListener("input", e => {
  state.driftY = parseFloat(e.target.value);
  stamp();
});

document.getElementById("rotation").addEventListener("input", e => {
  state.rotation = parseFloat(e.target.value);
  stamp();
});


/* =====================
   PERSISTENCE FADE
===================== */
function prepareCanvas() {
  if (!state.layered) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    return;
  }

  const fade = 1 - state.trailFade;
  if (fade > 0) {
    ctx.fillStyle = `rgba(0,0,0,${fade})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}


/* =====================
   TEXT DRAW (TEMPORAL)
===================== */
let textPhase = 0;

function drawTextFrame() {
  ctx.save();

  ctx.globalCompositeOperation = state.blendMode;
  ctx.globalAlpha = state.opacity;
  ctx.fillStyle = "#fff";

  ctx.font = `900 ${state.fontSize}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(state.rotation);

  ctx.fillText(state.text, state.driftX, state.driftY);

  ctx.restore();
}

/* =====================
   OVERLAY
===================== */
function drawOverlay() {
  if (!state.overlayImage) return;

  ctx.save();
  ctx.globalCompositeOperation = "difference";
  ctx.globalAlpha = 0.6;

  ctx.drawImage(
    state.overlayImage,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();
}

/* =====================
   ANIMATION LOOP
===================== */
function animate() {
  if (!state.running) return;

  drawTextFrame();
  // drawOverlay();

  requestAnimationFrame(animate);
}

function stamp() {
  drawTextFrame();
  drawOverlay();
}

/* =====================
   INIT
===================== */
ctx.fillStyle = "#000";
ctx.fillRect(0, 0, canvas.width, canvas.height);
loadImage();
animate();
</script>

</body>
</html>
