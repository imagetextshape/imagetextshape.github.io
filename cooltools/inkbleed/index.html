<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel='icon' href='data:;base64,='>
  <script src='tailwindcss.min.js'></script>
  <title>Inkbleed</title>
</head>
<body class="bg-neutral-900 text-white">

<div class="flex min-h-screen p-6 gap-6">

  <!-- LEFT PANEL -->
  <div class="flex flex-col gap-4 w-full max-w-xs">


<div class="flex justify-between underline text-blue-400">
  <a href="variations/text-alt.html">Alt1</a>
  <a href="variations/text-alt2.html">Alt2</a>
  <a href="variations/text-alt3.html">Alt3</a>
  <a href="variations/text-alt4.html">Alt4</a>
  <a href="variations/text-alt4.html">Alt4</a>
  <a href="variations/smear.html">OG</a>
</div>



    <!-- Dropzone -->
    <label id="dropzone"
           class="flex items-center justify-center border-2 border-dashed border-neutral-600 h-32 cursor-pointer hover:border-white transition">
      <span class="opacity-70">Drop image or click to upload</span>
      <input id="imageInput" type="file" accept="image/*" class="hidden" />
    </label>

    <!-- Text input -->
    <input id="textInput" type="text" value="electro"
      class="bg-black border border-neutral-700 px-3 py-2 w-full"
      placeholder="Enter text" />



<div class="flex justify-between gap-2">
    <!-- Text Color -->
      <label class="flex flex-col flex-1">
        Text Color
        <input id="textColor" type="color" value="#ffffff" class="w-1/2 mt-1">
      </label>

      <!-- Font Family -->
      <label class="flex flex-col">
        &nbsp;&nbsp;Font Family
        <select id="fontFamily" class="bg-black border border-neutral-700 px-3 py-2 mt-1">
          <option value="sans-serif">Sans Serif</option>
          <option value="serif">Serif</option>
          <option value="monospace" selected>Monospace</option>
          <option value="cursive">Cursive</option>
          <option value="fantasy">Fantasy</option>
        </select>
      </label>
    </div>


    <!-- Sliders -->
    <div class="flex flex-col gap-3">
      <!-- Text Size Slider -->
      <div class="flex flex-col gap-1">
        <label>Text Size</label>
        <input id="fontSize" type="range" min="5" max="400" step="1" value="250" class="mt-1">
        <div class="flex gap-2 text-sm">
          <input type="number" id="fontSizeMin" class="w-16 px-1 text-black" value="5">
          <input type="number" id="fontSizeMax" class="w-16 px-1 text-black" value="400">
          <input type="number" id="fontSizeStep" class="w-16 px-1 text-black" value="1">
          <button class="px-1 bg-gray-600 rounded" onclick="updateSlider('fontSize')">Set</button>
        </div>
      </div>

      <!-- Letter Spacing Slider -->
      <div class="flex flex-col gap-1">
        <label>Letter Spacing</label>
        <input id="letterSpacing" type="range" min="-50" max="150" step="1" value="0" class="mt-1">
        <div class="flex gap-2 text-sm">
          <input type="number" id="letterSpacingMin" class="w-16 px-1 text-black" value="-50">
          <input type="number" id="letterSpacingMax" class="w-16 px-1 text-black" value="150">
          <input type="number" id="letterSpacingStep" class="w-16 px-1 text-black" value="1">
          <button class="px-1 bg-gray-600 rounded" onclick="updateSlider('letterSpacing')">Set</button>
        </div>
      </div>

      <!-- X Drift -->
      <div class="flex flex-col gap-1">
        <label>X Drift</label>
        <input id="driftX" type="range" min="-20" max="20" step="0.1" value="0" class="mt-1">
        <div class="flex gap-2 text-sm">
          <input type="number" id="driftXMin" class="w-16 px-1 text-black" value="-20">
          <input type="number" id="driftXMax" class="w-16 px-1 text-black" value="20">
          <input type="number" id="driftXStep" class="w-16 px-1 text-black" value="0.1">
          <button class="px-1 bg-gray-600 rounded" onclick="updateSlider('driftX')">Set</button>
        </div>
      </div>

      <!-- Y Drift -->
      <div class="flex flex-col gap-1">
        <label>Y Drift</label>
        <input id="driftY" type="range" min="-20" max="20" step="0.1" value="0" class="mt-1">
        <div class="flex gap-2 text-sm">
          <input type="number" id="driftYMin" class="w-16 px-1 text-black" value="-20">
          <input type="number" id="driftYMax" class="w-16 px-1 text-black" value="20">
          <input type="number" id="driftYStep" class="w-16 px-1 text-black" value="0.1">
          <button class="px-1 bg-gray-600 rounded" onclick="updateSlider('driftY')">Set</button>
        </div>
      </div>
      
      <!-- Rotation -->
      <div class="flex flex-col gap-1">
        <label>Rotation</label>
        <input id="rotation" type="range" min="-0.5" max="0.5" step="0.001" value="0" class="mt-1">
        <div class="flex gap-2 text-sm">
          <input type="number" id="rotationMin" class="w-16 px-1 text-black" value="-0.5">
          <input type="number" id="rotationMax" class="w-16 px-1 text-black" value="0.5">
          <input type="number" id="rotationStep" class="w-16 px-1 text-black" value="0.001">
          <button class="px-1 bg-gray-600 rounded" onclick="updateSlider('rotation')">Set</button>
        </div>
      </div>

      <!-- Opacity -->
      <div class="flex flex-col gap-1">
        <label>Overlay Opacity</label>
        <input id="opacity" type="range" min="0.01" max="0.3" step="0.01" value="0.08" class="mt-1">
        <div class="flex gap-2 text-sm">
          <input type="number" id="opacityMin" class="w-16 px-1 text-black" value="0.01">
          <input type="number" id="opacityMax" class="w-16 px-1 text-black" value="0.3">
          <input type="number" id="opacityStep" class="w-16 px-1 text-black" value="0.01">
          <button class="px-1 bg-gray-600 rounded" onclick="updateSlider('opacity')">Set</button>
        </div>
      </div>

      <!-- Overlay Blend Mode -->
      <label class="flex flex-col">
        Overlay Blend Mode
        <select id="overlayBlendMode" class="bg-black border border-neutral-700 px-3 py-2 mt-1">
          <option value="normal">normal</option>
          <option value="multiply">multiply</option>
          <option value="screen">screen</option>
          <option value="overlay">overlay</option>
          <option value="difference" selected>difference</option>
          <option value="lighter">lighter</option>
        </select>
      </label>


    <!-- Add Reset button above Download -->
<button id="resetBtn"
        class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
  Reset Defaults
</button>

    </div>

    <!-- Download Button -->
    <button id="downloadBtn"
            class="mt-auto bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
      Download PNG
    </button>

  </div>

  <!-- CANVAS -->
  <div class="flex-1 flex justify-center items-start">
    <canvas id="canvas" class="border border-neutral-700" width="1280" height="768"></canvas>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
