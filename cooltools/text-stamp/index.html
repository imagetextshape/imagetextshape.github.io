<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel='icon' href='data:;base64,='>
  <script src='tailwindcss.min.js'></script>
  <link rel='stylesheet' href='style.css' />
  <title>Text Stamp</title>
</head>


<body class="h-screen overflow-hidden">

    <div class="flex h-full">

        <!-- LEFT PANEL -->
        <aside class="w-80 shrink-0 p-2 flex flex-col gap-2 bg-white border-r border-gray-200">

            <div class="flex items-center justify-between text-sm border border-gray-200 p-2 rounded">

                <input
                    type="color"
                    id="text-left-color-picker"
                    value="#000000"
                    class="appearance-none border-none outline-none w-6 h-6">

                <div class="flex items-center gap-2">

                    <label for="trans-bg-left-paragraph-left-checkbox">
                        B/W
                    </label>

                    <input
                        type="checkbox"
                        id="trans-bg-left-paragraph-left-checkbox"
                        class="w-4 h-4 scale-125">

                    <label for="invert-paragraph-left-checkbox">
                        Highlight
                    </label>

                    <input
                        type="checkbox"
                        id="invert-paragraph-left-checkbox"
                        class="w-4 h-4 scale-125">

                </div>

            </div>

            <textarea
                id="paragraphLeftInput"
                class="h-full border border-gray-300 rounded p-2 resize-none"
                placeholder="Say something pithy"
                autofocus></textarea>

        </aside>

        <!-- CANVAS -->
       <main class="flex-1 overflow-auto bg-gray-100">

    <div class="w-full h-full flex justify-center items-start pt-0">

        <canvas
            id="canvas"
            class="block border-[50px] border-white shrink-0"></canvas>

    </div>

</main>
    </div>

</body>


<script src="script.js"></script>
</body>
</html>
