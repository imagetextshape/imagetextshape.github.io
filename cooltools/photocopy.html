<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photocopy</title>
<link rel='icon' href='https://dropzone.olk1.com/uploads/imagetextshape.png'>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: flex;
    height: 100vh;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
  }

  a{
    color: white;
  }
  /* Left control panel */
  #controls {
    width: 300px;
    background: #1a1a1a;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-right: 1px solid #333;
  }

  #dropzone {
    border: 2px dashed #555;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    color: #aaa;
    cursor: pointer;
    transition: background 0.3s;
  }
  #dropzone:hover { background: #222; }

  label { font-size: 0.9em; display: flex; flex-direction: column; gap: 5px; }
  input[type="range"] { width: 100%; }
  button {
    background: #333;
    color: #eee;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s;
  }
  button:hover { background: #444; }

  /* Right preview area */
  #preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  canvas { max-width: 95%; max-height: 95%; border: 1px solid #222; }
</style>
</head>
<body>
<div id="controls">

<!-- ========== NAV ========== -->
<div class="bg-gray-100 text-blue-700 flex justify-center px-1 mb-2 w-full">
  <a href="index.html">Texture</a>
  <a href="inkbleed.html">Inkbleed</a>
  <a href="destructor.html">Destructor</a>
</div>


  <div id="dropzone">Click or Drop Image Here</div>
  <input id="fileInput" type="file" accept="image/*" style="display:none">

  <label>Contrast: <span id="contrastVal">1.0</span>
    <input id="contrastSlider" type="range" min="0.5" max="3" step="0.1" value="1">
  </label>

  <label>Noise Intensity: <span id="noiseVal">0.1</span>
    <input id="noiseSlider" type="range" min="0" max="0.5" step="0.01" value="0.1">
  </label>

  <label>Banding Strength: <span id="bandVal">0.1</span>
    <input id="bandSlider" type="range" min="0" max="1" step="0.05" value="0.1">
  </label>

  <label>Misalignment: <span id="shiftVal">2</span> px
    <input id="shiftSlider" type="range" min="0" max="10" step="1" value="2">
  </label>

  <label>Multi-Pass (Degrade Copies): <span id="passVal">1</span>
  </label>
    <input id="passSlider" type="range" min="1" max="10" step="1" value="1">

  <button id="compareBtn">Compare Original</button>
  <button id="resetBtn">Reset</button>
  <button id="saveBtn">Save Image</button>
</div>

<div id="preview">
  <canvas id="photoCanvas"></canvas>
</div>

<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("photoCanvas");
const ctx = canvas.getContext("2d");

const sliders = {
  contrast: document.getElementById("contrastSlider"),
  noise: document.getElementById("noiseSlider"),
  band: document.getElementById("bandSlider"),
  shift: document.getElementById("shiftSlider"),
  pass: document.getElementById("passSlider"),
};
const vals = {
  contrast: document.getElementById("contrastVal"),
  noise: document.getElementById("noiseVal"),
  band: document.getElementById("bandVal"),
  shift: document.getElementById("shiftVal"),
  pass: document.getElementById("passVal"),
};
const resetBtn = document.getElementById("resetBtn");
const saveBtn = document.getElementById("saveBtn");
const compareBtn = document.getElementById("compareBtn");

let image = null;
let showingOriginal = false;
let originalImageCanvas = null;
let originalImageData = null;

// --- Dropzone logic ---
dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.style.background = "#222"; });
dropzone.addEventListener("dragleave", () => dropzone.style.background = "");
dropzone.addEventListener("drop", e => {
  e.preventDefault(); dropzone.style.background = "";
  const file = e.dataTransfer.files[0]; if(file) loadImage(file);
});
fileInput.addEventListener("change", e => {
  const file = e.target.files[0]; if(file) loadImage(file);
});

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      image = img;
      originalImageCanvas = document.createElement("canvas");
      originalImageCanvas.width = img.width;
      originalImageCanvas.height = img.height;
      const octx = originalImageCanvas.getContext("2d");
      octx.drawImage(img, 0, 0);
      originalImageData = octx.getImageData(0, 0, img.width, img.height);

      canvas.width = img.width;
      canvas.height = img.height;
      drawPhotocopyEffect();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// --- Photocopier effect ---
function drawPhotocopyEffect() {
  if (!originalImageData) return;


  // If we're in compare/original view, just show the original
  if (showingOriginal) {
    ctx.putImageData(originalImageData, 0, 0);
    return;
  }

  const temp = document.createElement("canvas");
  temp.width = canvas.width;
  temp.height = canvas.height;
  const tctx = temp.getContext("2d");

  // Start from original
  tctx.putImageData(originalImageData, 0, 0);

  const passes = parseInt(sliders.pass.value);
  const w = temp.width;
  const h = temp.height;
  const contrast = parseFloat(sliders.contrast.value);
  const noiseAmt = parseFloat(sliders.noise.value);
  const bandStrength = parseFloat(sliders.band.value);
  const shift = parseFloat(sliders.shift.value);

  for (let p = 0; p < passes; p++) {
    const imgData = tctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    // Misalignment — both X and Y random drift
    const xShift = (Math.random() - 0.5) * 2 * shift;
    const yShift = (Math.random() - 0.5) * 2 * shift;

    const shifted = document.createElement("canvas");
    shifted.width = w;
    shifted.height = h;
    const sctx = shifted.getContext("2d");
    sctx.drawImage(temp, xShift, yShift, w, h, 0, 0, w, h);
    const sPix = sctx.getImageData(0, 0, w, h).data;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4;
        let r=sPix[i], g=sPix[i+1], b=sPix[i+2];
        let gray = 0.299*r + 0.587*g + 0.114*b;
        gray = (((gray/255)-0.5)*contrast + 0.5)*255;
        gray += (Math.random()-0.5)*255*noiseAmt;
        gray += Math.sin(y/5)*255*bandStrength;
        gray = Math.min(255, Math.max(0, gray));
        data[i] = data[i+1] = data[i+2] = gray;
      }
    }
    tctx.putImageData(imgData, 0, 0);

    // Subtle glare overlay
    const grad = tctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,"rgba(255,255,255,0.05)");
    grad.addColorStop(1,"rgba(0,0,0,0.15)");
    tctx.fillStyle = grad;
    tctx.fillRect(0,0,w,h);
  }

  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(temp, 0, 0);
}

// --- Update slider labels ---
function updateLabels() {
  for (const k in vals) vals[k].textContent = sliders[k].value;
}
for (const k in sliders) {
  sliders[k].addEventListener("input", () => {
    updateLabels();
    drawPhotocopyEffect();
  });
}

resetBtn.addEventListener("click", ()=>{ for(const k in sliders) sliders[k].value=sliders[k].defaultValue; updateLabels(); drawPhotocopyEffect(); });
saveBtn.addEventListener("click", ()=>{
  const a=document.createElement("a");
  a.download="destructor.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
});
compareBtn.addEventListener("click", ()=>{
  showingOriginal=!showingOriginal;
  compareBtn.textContent=showingOriginal?"Show Effect":"Compare Original";
  drawPhotocopyEffect();
});
updateLabels();
</script>

</body>
</html>
