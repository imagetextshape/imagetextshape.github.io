<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test A Font</title>

<script src='tailwindcss.min.js'></script>

<style>
html,
body {
    height: 100%;
    margin: 0;
}

.preview-text {
    white-space: pre-wrap;
    word-break: break-word;
}

.small-caps {
    font-variant: small-caps;
}

.uppercase-text {
    text-transform: uppercase;
}
</style>
</head>
<body>

<div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-[300px] border-r bg-gray-50 overflow-y-auto p-4 space-y-5">

        <h1 class="text-xl font-bold">
            Font Preview Tool
        </h1>

        <!-- Font Upload -->
        <div>
            <label class="block font-semibold mb-2">
                Font File (Upload or drop below)
            </label>

            <input
                id="fontFile"
                type="file"
                accept=".ttf,.otf,.woff,.woff2"
                class="bg-gray-100 w-full border p-2"
            >
        </div>

        <!-- Text Input -->
        <div>
            <label class="block font-semibold mb-2">
                Text
            </label>

            <textarea
                id="textInput"
                rows="10"
                class="w-full border p-2 resize-none"
            >The quick brown fox jumps over the lazy dog

ABCDEFGHIJKLMNOPQRSTUVWXYZ

abcdefghijklmnopqrstuvwxyz

0123456789</textarea>
        </div>

        <!-- Font Size -->
        <div>
            <div class="flex justify-between mb-1">
                <span>Font Size</span>
                <span id="fontSizeValue">48</span>
            </div>

            <input
                id="fontSize"
                type="range"
                min="8"
                max="300"
                value="48"
                class="w-full"
            >
        </div>

        <!-- Line Height -->
        <div>
            <div class="flex justify-between mb-1">
                <span>Line Height</span>
                <span id="lineHeightValue">1.2</span>
            </div>

            <input
                id="lineHeight"
                type="range"
                min="50"
                max="400"
                value="120"
                class="w-full"
            >
        </div>

        <!-- Letter Spacing -->
        <div>
            <div class="flex justify-between mb-1">
                <span>Letter Spacing</span>
                <span id="letterSpacingValue">0</span>
            </div>

            <input
                id="letterSpacing"
                type="range"
                min="-10"
                max="50"
                value="0"
                class="w-full"
            >
        </div>

        <!-- Word Spacing -->
        <div>
            <div class="flex justify-between mb-1">
                <span>Word Spacing</span>
                <span id="wordSpacingValue">0</span>
            </div>

            <input
                id="wordSpacing"
                type="range"
                min="-10"
                max="100"
                value="0"
                class="w-full"
            >
        </div>

        <!-- Style Options -->
        <div class="space-y-2">

            <label class="flex items-center gap-2">
                <input type="checkbox" id="bold">
                Bold
            </label>

            <label class="flex items-center gap-2">
                <input type="checkbox" id="italic">
                Italic
            </label>

            <label class="flex items-center gap-2">
                <input type="checkbox" id="smallCaps">
                Small Caps
            </label>

            <label class="flex items-center gap-2">
                <input type="checkbox" id="uppercase">
                Uppercase
            </label>

            <label class="flex items-center gap-2">
                <input type="checkbox" id="invert">
                Invert Colours
            </label>

        </div>

        <!-- Alignment -->
        <div>

            <div class="font-semibold mb-2">
                Alignment
            </div>

            <div class="space-y-2">

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="align"
                        value="left"
                        checked
                    >
                    Left
                </label>

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="align"
                        value="center"
                    >
                    Center
                </label>

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="align"
                        value="right"
                    >
                    Right
                </label>
                
                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="align"
                        value="justify"
                    >
                    Jusitfy
                </label>

            </div>

        </div>

    </aside>

    <!-- PREVIEW -->
    <main
        id="previewArea"
        class="flex-1 bg-white text-black overflow-auto"
    >

        <div class="p-10 h-full">

            <div
                id="previewText"
                class="preview-text"
            ></div>

        </div>

    </main>

</div>

<script>

const fontFile = document.getElementById('fontFile');

const textInput = document.getElementById('textInput');

const previewText = document.getElementById('previewText');
const previewArea = document.getElementById('previewArea');

const fontSize = document.getElementById('fontSize');
const lineHeight = document.getElementById('lineHeight');
const letterSpacing = document.getElementById('letterSpacing');
const wordSpacing = document.getElementById('wordSpacing');

const fontSizeValue = document.getElementById('fontSizeValue');
const lineHeightValue = document.getElementById('lineHeightValue');
const letterSpacingValue = document.getElementById('letterSpacingValue');
const wordSpacingValue = document.getElementById('wordSpacingValue');

const bold = document.getElementById('bold');
const italic = document.getElementById('italic');
const smallCaps = document.getElementById('smallCaps');
const uppercase = document.getElementById('uppercase');
const invert = document.getElementById('invert');

let loadedFontName = null;

function updatePreview() {

    previewText.textContent = textInput.value;

    const size = Number(fontSize.value);
    const lh = Number(lineHeight.value) / 100;
    const ls = Number(letterSpacing.value);
    const ws = Number(wordSpacing.value);

    fontSizeValue.textContent = size;
    lineHeightValue.textContent = lh.toFixed(2);
    letterSpacingValue.textContent = ls;
    wordSpacingValue.textContent = ws;

    previewText.style.fontSize = `${size}px`;
    previewText.style.lineHeight = lh;
    previewText.style.letterSpacing = `${ls}px`;
    previewText.style.wordSpacing = `${ws}px`;

    previewText.style.fontWeight =
        bold.checked ? '700' : '400';

    previewText.style.fontStyle =
        italic.checked ? 'italic' : 'normal';

    previewText.classList.toggle(
        'small-caps',
        smallCaps.checked
    );

    previewText.classList.toggle(
        'uppercase-text',
        uppercase.checked
    );

    const alignment =
        document.querySelector(
            'input[name="align"]:checked'
        ).value;

    previewText.style.textAlign = alignment;

    if (invert.checked) {

        previewArea.classList.remove(
            'bg-white',
            'text-black'
        );

        previewArea.classList.add(
            'bg-black',
            'text-white'
        );

    } else {

        previewArea.classList.remove(
            'bg-black',
            'text-white'
        );

        previewArea.classList.add(
            'bg-white',
            'text-black'
        );
    }
}

fontFile.addEventListener('change', async e => {

    const file = e.target.files[0];

    if (!file) return;

    const fontName =
        'font_' + Date.now();

    const fontUrl =
        URL.createObjectURL(file);

    const fontFace =
        new FontFace(
            fontName,
            `url(${fontUrl})`
        );

    try {

        await fontFace.load();

        document.fonts.add(fontFace);

        loadedFontName = fontName;

        previewText.style.fontFamily =
            `"${loadedFontName}"`;

    } catch (err) {

        alert(
            'Unable to load font file.'
        );

        console.error(err);
    }

});

[
    textInput,
    fontSize,
    lineHeight,
    letterSpacing,
    wordSpacing,
    bold,
    italic,
    smallCaps,
    uppercase,
    invert
].forEach(el => {

    el.addEventListener(
        'input',
        updatePreview
    );

    el.addEventListener(
        'change',
        updatePreview
    );

});

document
    .querySelectorAll(
        'input[name="align"]'
    )
    .forEach(el => {
        el.addEventListener(
            'change',
            updatePreview
        );
    });

updatePreview();

</script>

</body>
</html>
