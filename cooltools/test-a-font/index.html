<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test A Font</title>
<link rel='icon' href='data:;base64,='>
<script src='tailwindcss.min.js'></script>

<style>
html,
body {
    height: 100%;
    margin: 0;
}

.preview-text {
    white-space: pre-wrap;
    /* word-break: break-word; */
    display: block;
    width: 100%;
    white-space: pre-wrap;
    text-align: left;
}

.small-caps {
    font-variant: small-caps;
}

.uppercase-text {
    text-transform: uppercase;
}
</style>
</head>
<body>

<div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-[300px] border-r bg-gray-50 overflow-y-auto p-4 space-y-5">

        <h1 class="text-xl font-bold">
            Font Preview Tool
        </h1>

        <!-- Font Upload -->
        <div>
            <label class="block font-semibold mb-2">
                Font File (Upload or drop below)
            </label>

            <input
                id="fontFile"
                type="file"
                accept=".ttf,.otf,.woff,.woff2"
                class="bg-gray-100 w-full border p-2"
            >
        </div>

        <!-- Text Input -->
        <div>
            <label class="block font-semibold mb-2">
                Text
            </label>

            <textarea
                id="textInput"
                rows="10"
                class="w-full border p-2 resize-none"
            >electro
composer

original
human
made
music

[sound on]</textarea>
        </div>

        <!-- Font Size -->
        <div>
            <div class="flex justify-between mb-1">
                <span>Font Size</span>
                <span id="fontSizeValue">171</span>
            </div>

            <input
                id="fontSize"
                type="range"
                min="1"
                max="3000"
                value="171"
                class="w-full"
            >
        </div>

        <!-- Line Height -->
        <div>
            <div class="flex justify-between mb-1">
                <span>Line Height</span>
                <span id="lineHeightValue">0.85</span>
            </div>

            <input
                id="lineHeight"
                type="range"
                min="1"
                max="400"
                value="0.85"
                class="w-full"
            >
        </div>

        <!-- Letter Spacing -->
        <div>
            <div class="flex justify-between mb-1">
                <span>Letter Spacing</span>
                <span id="letterSpacingValue">-5</span>
            </div>

            <input
                id="letterSpacing"
                type="range"
                min="-500"
                max="500"
                value="-5"
                class="w-full"
            >
        </div>

        <!-- Word Spacing -->
        <div>
            <div class="flex justify-between mb-1">
                <span>Word Spacing</span>
                <span id="wordSpacingValue">0</span>
            </div>

            <input
                id="wordSpacing"
                type="range"
                min="-500"
                max="500"
                value="0"
                class="w-full"
            >
        </div>

        <!-- Style Options -->
        <div class="space-y-2">

            <label class="flex items-center gap-2">
                <input type="checkbox" checked id="bold">
                Bold
            </label>

            <label class="flex items-center gap-2">
                <input type="checkbox" id="italic">
                Italic
            </label>

            <label class="flex items-center gap-2">
                <input type="checkbox" id="smallCaps">
                Small Caps
            </label>

            <label class="flex items-center gap-2">
                <input type="checkbox" id="uppercase">
                Uppercase
            </label>

            <label class="flex items-center gap-2">
                <input type="checkbox" id="invert">
                Invert Colours
            </label>

        </div>

        <!-- Alignment -->
        <div>

            <div class="font-semibold mb-2">
                Alignment
            </div>

            <div class="space-y-2">

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="align"
                        value="left"
                        checked
                    >
                    Left
                </label>

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="align"
                        value="center"
                    >
                    Center
                </label>

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="align"
                        value="right"
                    >
                    Right
                </label>
                
                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="align"
                        value="justify"
                    >
                    Justify
                </label>

            </div>

        </div>


<button
    id="downloadPng"
    class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 w-full">
    Download PNG
</button>
    </aside>

    <!-- PREVIEW -->
    <main
        id="previewArea"
        class="flex-1 bg-white text-black overflow-auto"
    >

        <div class="p-10 h-full">

            <div
                id="previewText"
                class="preview-text"
            ></div>

        </div>

    </main>

</div>

<script>

const fontFile = document.getElementById('fontFile');

const textInput = document.getElementById('textInput');

const previewText = document.getElementById('previewText');
const previewArea = document.getElementById('previewArea');

const fontSize = document.getElementById('fontSize');
const lineHeight = document.getElementById('lineHeight');
const letterSpacing = document.getElementById('letterSpacing');
const wordSpacing = document.getElementById('wordSpacing');

const fontSizeValue = document.getElementById('fontSizeValue');
const lineHeightValue = document.getElementById('lineHeightValue');
const letterSpacingValue = document.getElementById('letterSpacingValue');
const wordSpacingValue = document.getElementById('wordSpacingValue');

const bold = document.getElementById('bold');
const italic = document.getElementById('italic');
const smallCaps = document.getElementById('smallCaps');
const uppercase = document.getElementById('uppercase');
const invert = document.getElementById('invert');

let loadedFontName = null;

function updatePreview() {

    previewText.textContent = textInput.value;

    const size = Number(fontSize.value);
    const lh = Number(lineHeight.value) / 100;
    const ls = Number(letterSpacing.value);
    const ws = Number(wordSpacing.value);

    fontSizeValue.textContent = size;
    lineHeightValue.textContent = lh.toFixed(2);
    letterSpacingValue.textContent = ls;
    wordSpacingValue.textContent = ws;

    previewText.style.fontSize = `${size}px`;
    previewText.style.lineHeight = lh;
    previewText.style.letterSpacing = `${ls}px`;
    previewText.style.wordSpacing = `${ws}px`;

    previewText.style.fontWeight =
        bold.checked ? '700' : '400';

    previewText.style.fontStyle =
        italic.checked ? 'italic' : 'normal';

    previewText.classList.toggle(
        'small-caps',
        smallCaps.checked
    );

    previewText.classList.toggle(
        'uppercase-text',
        uppercase.checked
    );

    const alignment =
        document.querySelector(
            'input[name="align"]:checked'
        ).value;

    previewText.style.textAlign = alignment;

    if (invert.checked) {

        previewArea.classList.remove(
            'bg-white',
            'text-black'
        );

        previewArea.classList.add(
            'bg-black',
            'text-white'
        );

    } else {

        previewArea.classList.remove(
            'bg-black',
            'text-white'
        );

        previewArea.classList.add(
            'bg-white',
            'text-black'
        );
    }
}

fontFile.addEventListener('change', async e => {

    const file = e.target.files[0];

    if (!file) return;

    const fontName =
        'font_' + Date.now();

    const fontUrl =
        URL.createObjectURL(file);

    const fontFace =
        new FontFace(
            fontName,
            `url(${fontUrl})`
        );

    try {

        await fontFace.load();

        document.fonts.add(fontFace);

        loadedFontName = fontName;

        previewText.style.fontFamily =
            `"${loadedFontName}"`;

    } catch (err) {

        alert(
            'Unable to load font file.'
        );

        console.error(err);
    }

});

[
    textInput,
    fontSize,
    lineHeight,
    letterSpacing,
    wordSpacing,
    bold,
    italic,
    smallCaps,
    uppercase,
    invert
].forEach(el => {

    el.addEventListener(
        'input',
        updatePreview
    );

    el.addEventListener(
        'change',
        updatePreview
    );

});

document
    .querySelectorAll(
        'input[name="align"]'
    )
    .forEach(el => {
        el.addEventListener(
            'change',
            updatePreview
        );
    });

updatePreview();

//
//
//
//
//
//
//
const downloadPng = document.getElementById('downloadPng');

downloadPng.addEventListener('click', async () => {

    await document.fonts.ready;

    if (loadedFontName) {
        await document.fonts.load(`16px "${loadedFontName}"`);
    }

    const padding = 60;

    const text = textInput.value || '';

    const fontSizeVal = Number(fontSize.value);
    const lineHeightScale = Number(lineHeight.value) / 100;
    const letterSpacingVal = Number(letterSpacing.value);
    const wordSpacingVal = Number(wordSpacing.value);

    const alignment = document.querySelector(
        'input[name="align"]:checked'
    ).value;

    const isBold = bold.checked;
    const isItalic = italic.checked;
    const isUppercase = uppercase.checked;
    const isSmallCaps = smallCaps.checked;

    const fontFamily = loadedFontName
        ? `"${loadedFontName}"`
        : 'sans-serif';

    // -------------------------
    // TEMP CANVAS FOR MEASURING
    // -------------------------
    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');

    mctx.font = `${isItalic ? 'italic ' : ''}${isBold ? '700' : '400'} ${fontSizeVal}px ${fontFamily}`;

    const lines = text.split('\n');

    const layout = [];
    let maxWidth = 0;

    for (const line of lines) {

        const tokens = line.split(/(\s+)/); // KEEP SPACES

        let lineWidth = 0;
        const tokenBlocks = [];

        for (const token of tokens) {

            // -------------------------
            // SPACE TOKEN
            // -------------------------
            if (token.trim() === '') {

                const spaceWidth = mctx.measureText(token).width;

                tokenBlocks.push({
                    type: 'space',
                    raw: token,
                    width: spaceWidth
                });

                lineWidth += spaceWidth;
                continue;
            }

            // -------------------------
            // WORD TOKEN
            // -------------------------
            const displayToken =
                isUppercase
                    ? token.toUpperCase()
                    : isSmallCaps
                        ? token.toUpperCase()
                        : token;

            const chars = [...displayToken];

            const measuredChars = chars.map(ch => ({
                ch,
                w: mctx.measureText(ch).width
            }));

            const wordWidth =
                measuredChars.reduce((a, c) => a + c.w, 0) +
                letterSpacingVal * Math.max(chars.length - 1, 0);

            tokenBlocks.push({
                type: 'word',
                chars: measuredChars,
                width: wordWidth
            });

            lineWidth += wordWidth;
        }

        maxWidth = Math.max(maxWidth, lineWidth);

        layout.push({
            tokens: tokenBlocks,
            lineWidth
        });
    }

    // -------------------------
    // CANVAS SIZE
    // -------------------------
    const lineHeightPx = fontSizeVal * lineHeightScale;

    const canvasWidth = Math.max(1, Math.ceil(maxWidth + padding * 2));
    const canvasHeight = Math.max(
        1,
        Math.ceil(layout.length * lineHeightPx + padding * 2)
    );

    const canvas = document.createElement('canvas');
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    const ctx = canvas.getContext('2d');

    ctx.textBaseline = 'top';
    ctx.font = `${isItalic ? 'italic ' : ''}${isBold ? '700' : '400'} ${fontSizeVal}px ${fontFamily}`;
    ctx.fillStyle = previewText.style.color || '#000';

    let y = padding;

    // -------------------------
    // RENDER PASS
    // -------------------------
    for (const line of layout) {

        let x;

        if (alignment === 'center') {
            x = (canvas.width - line.lineWidth) / 2;
        } else if (alignment === 'right') {
            x = canvas.width - line.lineWidth - padding;
        } else {
            x = padding;
        }

        for (const token of line.tokens) {

            // SPACE
            if (token.type === 'space') {
                x += token.width + wordSpacingVal;
                continue;
            }

            // WORD
            for (const ch of token.chars) {

                ctx.fillText(ch.ch, x, y);
                x += ch.w + letterSpacingVal;
            }

            // add word spacing AFTER word
            x += wordSpacingVal;
        }

        y += lineHeightPx;
    }

    // -------------------------
    // DOWNLOAD
    // -------------------------
    const link = document.createElement('a');
    link.download = 'text.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});
</script>

</body>
</html>
